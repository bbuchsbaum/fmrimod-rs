name: Rust workspace
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      VECLIB_MAXIMUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux plotting dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo fmt --all --check
      - name: Repository structure and package inventory
        run: python scripts/check_repository.py
      - name: Numerical kernels lint
        run: cargo clippy -p fmri-noise -p fmri-reg -p fmri-group --lib --all-features --locked -- -D warnings

      - name: External Git dependency consumers
        run: python scripts/verify_git_consumer.py --rev ${{ github.sha }}
