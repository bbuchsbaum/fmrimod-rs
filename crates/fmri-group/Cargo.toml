[package]
name = "fmri-group"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Identified independent-subject fMRI group estimation"

[dependencies]
fmridataset = { path = "../fmridataset" }
fmrireg = { path = "../fmrireg" }
ndarray = "0.16"
nalgebra = "0.32"
statrs = "0.16"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
libc = "0.2"
