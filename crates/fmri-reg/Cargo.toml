[package]
name = "fmri-reg"
license = "MIT OR Apache-2.0"
description = "Reusable mass-univariate least squares estimation"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "LICENSE*", "Cargo.toml"]

[dependencies]
ndarray = { workspace = true }
nalgebra = { workspace = true }
thiserror = { workspace = true }
statrs = { workspace = true }
fmri-noise = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[dependencies.fmri-data]
workspace = true
optional = true

[features]
default = []
# Uses the system framework on macOS; other targets retain the portable backend.
accelerate = []
dataset = ["dep:fmri-data"]

[[example]]
name = "selected_gls"
required-features = ["dataset"]

[[example]]
name = "selected_ar1"
required-features = ["dataset"]

[[example]]
name = "selected_arp"
required-features = ["dataset"]

[[example]]
name = "selected_qualification"
required-features = ["dataset"]
