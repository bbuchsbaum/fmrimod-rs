[package]
name = "fmri-splines"
description = "Spline bases supporting the fmrimod modelling workspace"
license = "MIT OR Apache-2.0"
categories = ["science", "mathematics", "algorithms"]
keywords = ["statistics", "splines", "interpolation", "bsplines", "numerical"]

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "LICENSE*", "Cargo.toml"]

[dependencies]
# Core data structures and linear algebra
ndarray = { workspace = true, features = ["serde"] }
nalgebra = { workspace = true }
num-traits = "0.2"
num-complex = "0.4"

# Error handling
thiserror = { workspace = true }
anyhow = "1.0"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Performance
rayon = { version = "1.8", optional = true }

# Logging
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.8"
approx = "0.5"
env_logger = "0.10"

[features]
default = ["std"]
std = []
parallel = ["rayon"]

[[bench]]
name = "performance"
harness = false
