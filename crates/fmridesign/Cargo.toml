[package]
name = "fmridesign"
version = "0.1.0"
edition = "2021"
authors = ["fMRI Design Contributors"]
description = "Rust implementation of fMRI experimental design matrices"
license = "MIT OR Apache-2.0"
keywords = ["fmri", "neuroimaging", "design-matrix", "neuroscience"]
categories = ["science", "mathematics"]

[dependencies]
# Use the existing fmrihrf-rs implementation
fmrihrf = { path = "../fmrihrf" }
ndarray = { version = "0.16", features = ["serde"] }
nalgebra = "0.32"
polars = { version = "0.35", default-features = false }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = { version = "1.7", optional = true }
indexmap = "2.0"
num-integer = "0.1"
rand = "0.8"
itertools = "0.12"
nom = "7.1"  # For formula parsing
regex = "1.10"
lazy_static = "1.4"
plotly = { version = "0.8", optional = true }
plotters = { version = "0.3", optional = true }
indicatif = "0.17"
colored = "2.0"
num-traits = "0.2"
approx = "0.5"
statrs = "0.16"  # Statistical functions
enum_dispatch = "0.3"  # For efficient polymorphic dispatch
once_cell = "1.19"


[dev-dependencies]
criterion = "0.5"
proptest = "1.2"
pretty_assertions = "1.4"
tempfile = "3.8"
rand = "0.8"

[features]
default = []
visualization = ["plotly", "plotters"]
parallel = ["rayon"]

[[bench]]
name = "design_matrix"
harness = false

