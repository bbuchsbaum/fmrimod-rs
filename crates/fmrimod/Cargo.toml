[package]
name = "fmrimod"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Composable fMRI design and estimation"

[dependencies]
fmri-group = { path = "../fmri-group" }
ndarray = "0.16"
fmrihrf = { path = "../fmrihrf" }
fmrireg = { path = "../fmrireg", features = ["dataset"] }
fmri-noise = { path = "../fmri-noise" }
fmridataset = { path = "../fmridataset" }
fmridesign = { path = "../fmridesign", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"

[features]
default = []
formula = ["dep:fmridesign"]
nifti = ["fmridataset/nifti"]
accelerate = ["fmrireg/accelerate"]

[[example]]
name = "complete_first_level"
required-features = ["formula"]

[[example]]
name = "cohort_latency"
required-features = ["nifti"]
