[package]
name = "fmrimod"
license = "GPL-3.0-or-later"
description = "Composable fMRI design and estimation"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "benches/**", "README.md", "LICENSE*", "Cargo.toml"]

[dependencies]
fmri-group = { workspace = true }
ndarray = { workspace = true }
fmri-hrf = { workspace = true }
fmri-reg = { workspace = true, features = ["dataset"] }
fmri-noise = { workspace = true }
fmri-data = { workspace = true }
fmri-design = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = []
formula = ["dep:fmri-design"]
nifti = ["fmri-data/nifti"]
accelerate = ["fmri-reg/accelerate"]

[[example]]
name = "complete_first_level"
required-features = ["formula"]

[[example]]
name = "cohort_latency"
required-features = ["nifti"]

[[example]]
name = "analysis_viewer"
required-features = ["nifti"]
