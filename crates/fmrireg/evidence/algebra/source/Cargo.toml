[workspace]
members = ["crates/fmrihrf", "crates/fmridesign", "crates/fmridataset", "crates/splines", "crates/fmri-noise", "crates/fmrireg", "crates/fmrimod"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
debug = true

# Keep workspace test artifacts bounded on developer machines.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
