[package]
name = "fmridataset"
version = "0.1.0"
edition = "2021"
description = "Spatially typed, annotated observation-by-feature data"
license = "GPL-3.0-or-later"
repository = "https://github.com/bbuchsbaum/fmridataset-rs"
rust-version = "1.85"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[lib]
crate-type = ["rlib"]
[features]
default = []
