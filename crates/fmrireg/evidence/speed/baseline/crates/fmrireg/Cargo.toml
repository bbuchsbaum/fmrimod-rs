[package]
name = "fmrireg"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reusable mass-univariate least squares estimation"

[dependencies]
ndarray = "0.16"
nalgebra = "0.32"
thiserror = "1"
statrs = "0.16"
fmri-noise = { path = "../fmri-noise" }

[dev-dependencies]
serde_json = "1"

[dependencies.fmridataset]
path = "../fmridataset"
optional = true

[features]
default = []
dataset = ["dep:fmridataset"]
