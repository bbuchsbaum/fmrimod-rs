[package]
name = "splines"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Generated from R splines package"]
description = "Fast, safe Rust implementation of R splines package functionality"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/splines-rust"
documentation = "https://docs.rs/splines"
categories = ["science", "mathematics", "algorithms"]
keywords = ["statistics", "splines", "interpolation", "bsplines", "numerical"]

[dependencies]
# Core data structures and linear algebra
ndarray = { version = "0.16", features = ["serde"] }
nalgebra = "0.32"
num-traits = "0.2"
num-complex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Performance
rayon = { version = "1.8", optional = true }

# Logging
log = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.8"
approx = "0.5"
env_logger = "0.10"

[features]
default = ["std"]
std = []
parallel = ["rayon"]

[[bench]]
name = "performance"
harness = false

